name: Build
on:
  push:
  pull_request:

jobs:
  test:
    # Bản rút gọn để thử bot phân tích CI: 1 job (Ubuntu, JDK 17), bỏ cờ -X cho log gọn và chạy nhanh.
    runs-on: ubuntu-latest
    name: Test JDK 17, ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'

      - name: Maven Compile
        run: mvn compile -B --file pom.xml

      - name: Maven Verify
        run: mvn verify -B --file pom.xml
